<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MONETRA AWS System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        .brand-icon {
            font-size: 40px;
            color: #0d6efd;
            margin-bottom: 15px;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }
        .btn-custom {
            background-color: #0f172a;
            color: #fff;
            transition: background 0.2s;
        }
        .btn-custom:hover {
            background-color: #1e293b;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="fa-solid fa-water"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">MONETRA</h3>
            <p class="text-muted small">Stasiun AWS Maritim - Sistem Deteksi Anomali</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 text-center fs-6 shadow-sm" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 bg-light" required placeholder="Masukkan username admin">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold small text-secondary">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 bg-light" required placeholder="Masukkan password sistem">
                </div>
            </div>

            <button type="submit" class="btn btn-custom w-100 py-2 fw-bold shadow-sm">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Masuk Dashboard
            </button>
        </form>

        <div class="text-center mt-4 border-top pt-3">
            <small class="text-muted" style="font-size: 11px;">
                Secure Access • Universitas PGRI Sumatera Barat © 2026
            </small>
        </div>
    </div>

</body>
</html>
